name: Cookbook PR smoke
description: >-
  Pull-request smoke lane for ci.yml (#222): scoped golden comparisons
  (make verify-goldens), the focused live lanes scripts/ci_scope.py selected
  (make verify-quickstart / verify-performance / verify-ai-agent, fail-closed)
  and the cubrid-mcp-server tool surface against live CUBRID, on the latest
  published drivers. smoke-test.yml keeps the broad main/scheduled full
  make verify and the exact release verification runs. Runs after checkout and
  setup-python; the calling job uploads .live-evidence/.

inputs:
  cubrid-version:
    description: "CUBRID image tag to start (11.2 or 11.4)"
    required: true
  verify-paths:
    description: "Space-separated make verify-goldens roots from scripts/ci_scope.py ('.' = all)"
    required: true
  live-lanes:
    description: "Space-separated focused lanes from scripts/ci_scope.py smoke_lanes (quickstart performance ai-agent), or empty"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Start CUBRID containers
      shell: bash
      env:
        CUBRID_VERSION: ${{ inputs.cubrid-version }}
        LIVE_LANES: ${{ inputs.live-lanes }}
      run: |
        set -euo pipefail
        case "$CUBRID_VERSION" in
          11.2|11.4) ;;
          *) echo "::error::Unsupported CUBRID version: $CUBRID_VERSION"; exit 1 ;;
        esac
        for lane in $LIVE_LANES; do
          case "$lane" in
            quickstart|performance|ai-agent) ;;
            *) echo "::error::Unsupported live lane: $lane"; exit 1 ;;
          esac
        done
        # Started before dependency install so the image pull and engine
        # initialization overlap with pip install. "cubrid" is the examples
        # database every golden, the quickstart and the benchmarks hard-code.
        docker run -d --name cubrid --shm-size 512m \
          -e CUBRID_DB=testdb \
          -p 33000:33000 -p 1523:1523 \
          "cubrid/cubrid:$CUBRID_VERSION"
        # verify-ai-agent needs a dedicated, empty CUBRID_TEST_URL database.
        if [[ " $LIVE_LANES " == *" ai-agent "* ]]; then
          docker run -d --name cubrid-live --shm-size 512m \
            -e CUBRID_DB=testdb \
            -p 33100:33000 \
            "cubrid/cubrid:$CUBRID_VERSION"
        fi

    - name: Select and freeze released drivers
      shell: bash
      run: |
        set -euo pipefail
        # Pull requests select the latest published releases (no release request).
        # Composite steps cannot set timeout-minutes; bound the PyPI lookup here.
        timeout 10m python scripts/release_smoke.py select \
          --constraints "$RUNNER_TEMP/release-constraints.txt"
        python scripts/release_smoke.py freeze \
          --state "$RUNNER_TEMP/release-drivers.json" \
          --constraints "$RUNNER_TEMP/release-constraints.txt"
        echo "PIP_CONSTRAINT=$RUNNER_TEMP/release-constraints.txt" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        # PIP_CONSTRAINT keeps the selected drivers fixed during every install.
        python scripts/release_smoke.py install-mcp --state "$RUNNER_TEMP/release-drivers.json"
        # Every example requirements.txt, pytest and pytest-asyncio (one pip call).
        timeout 10m make deps

    - name: Wait for CUBRID readiness
      shell: bash
      run: |
        set -euo pipefail
        containers=(cubrid)
        if docker inspect cubrid-live >/dev/null 2>&1; then containers+=(cubrid-live); fi
        for name in "${containers[@]}"; do
          ready=0
          for i in $(seq 1 60); do
            if docker exec "$name" bash -lc "csql -u dba testdb -c 'SELECT 1;'" >/dev/null 2>&1; then
              echo "$name testdb is ready (attempt $i)"
              ready=1
              break
            fi
            echo "Waiting for $name testdb... attempt $i/60"
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::$name testdb did not become ready in time"
            docker logs "$name" || true
            exit 1
          fi
        done

    - name: Verify external client connectivity
      shell: bash
      run: |
        # csql proves the in-container engine; the broker accepts external TCP
        # slightly later. Wait until a real pycubrid client can query each port.
        ports=(33000)
        if docker inspect cubrid-live >/dev/null 2>&1; then ports+=(33100); fi
        python - "${ports[@]}" <<'PY'
        import os
        import sys
        import time

        import pycubrid

        for port in map(int, sys.argv[1:]):
            last_error = None
            for attempt in range(1, 31):
                try:
                    conn = pycubrid.connect(
                        host="localhost", port=port, database="testdb", user="dba", password=""
                    )
                    cursor = conn.cursor()
                    cursor.execute("SELECT 1")
                    cursor.fetchone()
                    cursor.close()
                    server_version = conn.get_server_version().replace("\n", " ").replace("\r", " ")
                    conn.close()
                    if port == 33000:
                        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
                            output.write(f"CUBRID_SERVER_VERSION={server_version}\n")
                    print(f"External pycubrid connection to {port} OK (attempt {attempt})")
                    break
                except Exception as error:
                    last_error = error
                    print(f"Waiting for broker {port}... attempt {attempt}/30: {error}")
                    time.sleep(3)
            else:
                print(f"External broker {port} not reachable in time: {last_error}")
                sys.exit(1)
        PY

    - name: Record tested versions
      shell: bash
      run: |
        set -o pipefail
        python scripts/release_smoke.py verify \
          --state "$RUNNER_TEMP/release-drivers.json" --report \
          | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Compare scoped goldens
      shell: bash
      env:
        VERIFY_PATHS: ${{ inputs.verify-paths }}
      run: |
        set -euo pipefail
        if [ -z "$VERIFY_PATHS" ]; then
          echo "::error::No verify scope; scripts/ci_scope.py must select one"
          exit 1
        fi
        printf '### PR smoke golden scope: `%s`\n' "$VERIFY_PATHS" >> "$GITHUB_STEP_SUMMARY"
        timeout 15m make verify-goldens VERIFY_PATHS="$VERIFY_PATHS"

    - name: Run the selected live lanes
      shell: bash
      env:
        LIVE_LANES: ${{ inputs.live-lanes }}
        # Dedicated, empty database for verify-ai-agent (never the examples database).
        CUBRID_TEST_URL: cubrid+pycubrid://dba@localhost:33100/testdb
      run: |
        set -euo pipefail
        printf '### PR smoke live lanes: `%s`\n' "${LIVE_LANES:-none}" >> "$GITHUB_STEP_SUMMARY"
        # One lane at a time after the goldens: they share the examples database.
        for lane in $LIVE_LANES; do
          case "$lane" in
            quickstart) timeout 5m make verify-quickstart ;;
            performance) timeout 5m make verify-performance ;;
            ai-agent)
              # Two sequential runs on the same database (#426); each keeps its evidence.
              timeout 4m make verify-ai-agent
              cp -a .live-evidence/ai-agent .live-evidence/ai-agent-run-1
              timeout 4m make verify-ai-agent
              cp -a .live-evidence/ai-agent .live-evidence/ai-agent-run-2
              ;;
          esac
        done

    - name: Smoke test cubrid-mcp-server
      shell: bash
      run: python scripts/mcp_smoke.py
