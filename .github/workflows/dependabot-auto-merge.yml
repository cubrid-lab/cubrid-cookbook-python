name: Dependabot auto-merge

# Automatically enable auto-merge for Dependabot patch/minor updates.
# Major updates are intentionally held for human review.
# Auto-merge only completes once branch protection's required checks pass.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Token permissions are granted per job (least privilege), never workflow-wide.
permissions: {}

jobs:
  auto-merge:
    # pull_request_target runs with a write-capable token: require both the
    # actor and the PR author to be Dependabot before doing anything.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch/minor updates
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
