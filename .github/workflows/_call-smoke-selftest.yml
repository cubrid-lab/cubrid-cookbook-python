name: Call smoke selftest (temporary, #190)

on:
  push:
    branches: [ci/190-reusable-smoke-workflow]

# Same least-privilege token a package release workflow would give the call.
permissions:
  contents: read

jobs:
  cookbook-smoke:
    permissions:
      contents: read
    uses: cubrid-lab/cubrid-cookbook-python/.github/workflows/smoke-test.yml@81cf7a70fc70a5e892fcab6519854c86f67e48b6
    with:
      package: pycubrid
      version: 9.9.9
      request_id: test-190-neg-7c41e2

  require-cookbook:
    needs: cookbook-smoke
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          STATUS: ${{ needs.cookbook-smoke.outputs.status }}
          REQUESTED: ${{ needs.cookbook-smoke.outputs.requested_version }}
          INSTALLED: ${{ needs.cookbook-smoke.outputs.installed_version }}
          ARTIFACT: ${{ needs.cookbook-smoke.outputs.artifact }}
          RESULT: ${{ needs.cookbook-smoke.result }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          printf 'result=%s status=%s requested=%s installed=%s artifact=%s caller_sha=%s\n'             "$RESULT" "$STATUS" "$REQUESTED" "$INSTALLED" "$ARTIFACT" "$CALLER_SHA"
          # Negative selftest: an unpublished release must fail with outputs set.
          [ "$RESULT" = failure ] && [ "$STATUS" = failure ] && [ "$REQUESTED" = 9.9.9 ] && [ -z "$INSTALLED" ]
