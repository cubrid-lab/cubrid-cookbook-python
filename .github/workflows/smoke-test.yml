name: Smoke Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [upstream-released]
  workflow_dispatch:

concurrency:
  group: smoke-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and runs untrusted
# PR-authored example code via `make verify`. A read-only token removes the
# write/approve escalation path if that code reaches the persisted credentials.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Report trigger
        env:
          # Pass untrusted repository_dispatch payload through the environment
          # instead of interpolating it directly into the shell, which would be
          # a command-injection vector.
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_PACKAGE: ${{ github.event.client_payload.package }}
          UPSTREAM_REF: ${{ github.event.client_payload.ref }}
        run: |
          printf 'Event: %s\n' "$EVENT_NAME"
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf 'Triggered by upstream release: %s %s\n' "$UPSTREAM_PACKAGE" "$UPSTREAM_REF"
            printf '### Triggered by upstream release: `%s %s`\n' "$UPSTREAM_PACKAGE" "$UPSTREAM_REF" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so PR-scoped verify can diff against the base commit.
          fetch-depth: 0
          # Do not persist GITHUB_TOKEN in .git/config: `make verify` runs
          # untrusted PR example code, which must not be able to read the token.
          persist-credentials: false

      - name: Scope verify to changed examples (pull requests only)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Non-PR events (push to main, cron, upstream release, manual dispatch)
          # always run the full suite: a dependency bump or scheduled run must
          # exercise every example, not just a diff.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "VERIFY_PATHS=." >> "$GITHUB_ENV"
            echo "Full verify (event=$EVENT_NAME)"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" 2>/dev/null || true
          CHANGED=$(git diff --name-only "$PR_BASE_SHA" HEAD)
          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          # Example roots are directories that own an expected/ folder.
          EXROOTS=$(find . -type d -name expected -not -path '*/node_modules/*' \
            | sed 's#/expected$##;s#^\./##' | sort -u)

          SELECTED=""
          FALLBACK=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            MATCH=""
            for root in $EXROOTS; do
              case "$f" in
                "$root"/*) MATCH="$root"; break ;;
              esac
            done
            if [ -n "$MATCH" ]; then
              # Reject any path with characters outside a safe allowlist before it
              # reaches $GITHUB_ENV / make / find. This closes the injection and
              # word-splitting surface from PR-controlled directory names; the
              # allowlist excludes spaces and shell metacharacters, so the
              # space-separated `find $(VERIFY_PATHS)` in the Makefile stays safe.
              case "$MATCH" in
                *[!A-Za-z0-9._/-]*)
                  echo "Unsafe example path forces full verify: $MATCH"
                  FALLBACK=1 ;;
                *)
                  case " $SELECTED " in *" $MATCH "*) : ;; *) SELECTED="$SELECTED $MATCH" ;; esac ;;
              esac
            else
              # A file outside every example dir (Makefile, scripts/, workflow,
              # shared requirements, docs) can affect any example -> full run.
              echo "Shared/global change forces full verify: $f"
              FALLBACK=1
            fi
          done <<< "$CHANGED"

          if [ "$FALLBACK" -eq 1 ] || [ -z "${SELECTED// /}" ]; then
            echo "VERIFY_PATHS=." >> "$GITHUB_ENV"
            echo "Full verify (fallback=$FALLBACK, selected='${SELECTED# }')"
          else
            echo "VERIFY_PATHS=${SELECTED# }" >> "$GITHUB_ENV"
            echo "Scoped verify: ${SELECTED# }"
            printf '### Scoped smoke: `%s`\n' "${SELECTED# }" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Start CUBRID container
        run: |
          # Started before dependency install so the image pull and engine
          # initialization overlap with pip install instead of running serially;
          # the readiness gate below then usually finds the engine already up.
          docker run -d --name cubrid --shm-size 512m \
            -e CUBRID_DB=testdb \
            -p 33000:33000 -p 1523:1523 \
            cubrid/cubrid:11.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # Rolling key: the target packages float to their latest release, so
          # this caches downloaded wheels (pandas, matplotlib, numpy, sqlalchemy)
          # without pinning versions. pip still queries PyPI for newer releases.
          key: pip-smoke-${{ runner.os }}-${{ hashFiles('.github/workflows/smoke-test.yml') }}
          restore-keys: |
            pip-smoke-${{ runner.os }}-

      - name: Install dependencies
        env:
          # Pass the untrusted repository_dispatch payload through the environment
          # (never interpolated directly into a shell/URL) to avoid injection.
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_PACKAGE: ${{ github.event.client_payload.package }}
          UPSTREAM_REF: ${{ github.event.client_payload.ref }}
        run: |
          pip install pycubrid sqlalchemy sqlalchemy-cubrid
          # Extra deps used by templates (e.g. batch-etl). Installed separately
          # so the released pycubrid/sqlalchemy-cubrid above are not overridden
          # by the git-pinned versions in the template requirements files.
          pip install pandas matplotlib
          # cubrid-mcp-server is not yet on PyPI, so it is installed from a git
          # ref. Default to a deterministic pinned tag for PR/push/cron/manual
          # runs; when an upstream release dispatches this workflow, install the
          # ref that was just released so the dogfood actually tests it.
          MCP_REF="v0.2.1"
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ "$UPSTREAM_PACKAGE" = "cubrid-mcp-server" ]; then
            case "$UPSTREAM_REF" in
              "")
                echo "Dispatched ref is empty; keeping default $MCP_REF" ;;
              # Reject anything outside a strict allowlist before it reaches the
              # git URL, closing the command-injection surface on untrusted input.
              *[!A-Za-z0-9._/-]*)
                echo "Dispatched ref '$UPSTREAM_REF' is unsafe; keeping default $MCP_REF" ;;
              # Only accept a strict release-tag pattern (vMAJOR.MINOR.PATCH) so
              # a dispatched ref points at an actual published release, not an
              # arbitrary branch/sha. Anything else falls back to the pinned tag.
              v[0-9]*.[0-9]*.[0-9]*)
                MCP_REF="$UPSTREAM_REF"
                MCP_DISPATCHED=1
                echo "Using dispatched cubrid-mcp-server release ref: $MCP_REF" ;;
              *)
                echo "Dispatched ref '$UPSTREAM_REF' is not a release tag; keeping default $MCP_REF" ;;
            esac
          fi
          pip install cubrid-mcp-server \
            || pip install "git+https://github.com/cubrid-lab/cubrid-mcp-server.git@${MCP_REF}"

      - name: Record tested versions
        run: |
          {
            echo "### Tested upstream versions";
            echo "";
            echo "| Package | Version |";
            echo "| --- | --- |";
            for pkg in pycubrid sqlalchemy-cubrid cubrid-mcp-server; do
              ver=$(pip show "$pkg" | awk -F': ' '/^Version:/ {print $2}');
              echo "| $pkg | ${ver:-not installed} |";
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for CUBRID readiness
        run: |
          # Use the in-container csql check (same as docker-compose healthcheck)
          # rather than a client connect; the broker accepts external TCP
          # connections slightly after the engine itself is ready.
          for i in $(seq 1 60); do
            if docker exec cubrid bash -lc "csql -u dba testdb -c 'SELECT 1;'" >/dev/null 2>&1; then
              echo "CUBRID testdb is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for CUBRID testdb... attempt $i/60"
            sleep 5
          done
          echo "CUBRID testdb did not become ready in time"
          docker logs cubrid || true
          exit 1

      - name: Verify external client connectivity
        run: |
          # The csql check only proves the in-container engine is up; the broker
          # accepts external TCP on the mapped port slightly later. Confirm a real
          # pycubrid client (the same path the examples use) can connect before
          # running make verify, otherwise the first example races the broker.
          python - <<'PY'
          import sys
          import time

          import pycubrid

          last_error = None
          for attempt in range(1, 31):
              try:
                  conn = pycubrid.connect(
                      host="localhost",
                      port=33000,
                      database="testdb",
                      user="dba",
                      password="",
                  )
                  cursor = conn.cursor()
                  cursor.execute("SELECT 1")
                  cursor.fetchone()
                  cursor.close()
                  conn.close()
                  print(f"External pycubrid connection OK (attempt {attempt})")
                  sys.exit(0)
              except Exception as error:
                  last_error = error
                  print(f"Waiting for external broker... attempt {attempt}/30: {error}")
                  time.sleep(3)

          print(f"External broker not reachable in time: {last_error}")
          sys.exit(1)
          PY

      - name: Run make verify
        run: make verify VERIFY_PATHS="${VERIFY_PATHS:-.}"

      - name: Smoke test cubrid-mcp-server
        run: |
          # Real-usage smoke: build the FastMCP server object and enumerate its
          # registered tools, rather than only importing the package. This exercises
          # the @mcp.tool registration path and catches a broken server surface (e.g.
          # a tool that fails to register) that a bare `import` would silently pass.
          # Tool handlers connect to CUBRID lazily (only on first call via _db()), so
          # listing the tool surface needs no live database and no CUBRID_* env vars.
          python - <<'PY'
          import asyncio

          from cubrid_mcp_server.server import mcp

          # The public tool contract documented in the server's README. Every
          # supported release must expose these; a rename or drop fails loudly.
          expected = {
              "all_table_names",
              "filter_table_names",
              "schema_definitions",
              "describe_table",
              "list_indexes",
              "explain_query",
              "table_row_counts",
              "list_serials",
              "list_class_hierarchy",
              "execute_query",
          }
          # Tools added after v0.2.1 (e.g. health_check on main). Allowed but not
          # required, so this contract stays green whether the pinned v0.2.1 tag
          # or a newer dispatched ref (see install step) is installed.
          optional = {
              "health_check",
          }

          tools = asyncio.run(mcp.list_tools())
          names = {tool.name for tool in tools}
          print(f"cubrid-mcp-server exposes {len(names)} tools: {sorted(names)}")

          missing = expected - names
          if missing:
              raise SystemExit(f"cubrid-mcp-server missing expected tools: {sorted(missing)}")

          # Fail on genuinely unknown tools so an upstream addition can't slip in
          # untracked; known-optional additions are tolerated on purpose.
          unknown = names - expected - optional
          if unknown:
              raise SystemExit(
                  "cubrid-mcp-server exposes undocumented tools "
                  f"(update the smoke-test contract): {sorted(unknown)}"
              )
          print("cubrid-mcp-server real-usage smoke OK")
          PY
