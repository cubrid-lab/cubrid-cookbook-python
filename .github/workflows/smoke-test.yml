name: Smoke Tests

# A release verification run is named so the upstream release workflow can find
# exactly its run through the Actions API (match display_title on the bracketed
# request_id). Other runs keep GitHub's default name (whitespace -> default).
# The name is display text only; run: steps never read these fields from here.
# Under workflow_call GitHub shows the caller's run name instead.
run-name: >-
  ${{ (github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch'
  && inputs.package != 'latest')) && format('Release verification {0}@{1} [request_id={2}]',
  github.event.client_payload.package || inputs.package,
  github.event.client_payload.ref || inputs.version,
  github.event.client_payload.request_id || inputs.request_id || 'none') || ' ' }}

# Pull requests are not a trigger (#222): ci.yml owns PR live coverage, including
# the required `Smoke Tests (CUBRID 11.x)` checks, so one PR never runs the broad
# 11.2/11.4 smoke twice. This workflow is the broad main/scheduled smoke, the
# manual run and the exact release verification. The daily schedule is kept: it
# caught make verify regressions on days without a main push (see CONTRIBUTING.md
# "CI tiers"). Validate a change to this file with
# `gh workflow run smoke-test.yml --ref <branch>` before merging.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [upstream-released]
  workflow_dispatch:
    # Manual release fallback when the upstream dispatch token is unavailable.
    # scripts/release_smoke.py reads and validates these values from the event
    # JSON (same path as repository_dispatch); they never enter shell code.
    # Leave both at their defaults for an ordinary latest-release smoke run.
    inputs:
      package:
        description: "Released package to verify exactly (latest = no pinned release)"
        type: choice
        default: latest
        options:
          - latest
          - pycubrid
          - sqlalchemy-cubrid
          - cubrid-mcp-server
      version:
        description: "Exact release to verify, MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH (required with a package)"
        type: string
        default: ""
      request_id:
        description: "Optional correlation id shown in the run name and report artifact, [A-Za-z0-9._-]{8,80}"
        type: string
        default: ""
  workflow_call:
    # Package release workflows call this workflow as a job with their own
    # GITHUB_TOKEN (no PAT): see "Release verification contract" in CONTRIBUTING.md.
    # The github context and GITHUB_EVENT_PATH are then the CALLER's, so these
    # inputs reach scripts/release_smoke.py only as RELEASE_INPUT_* environment
    # variables (never shell code), and each job checks out this repository at
    # the called workflow's own commit (job.workflow_sha).
    inputs:
      package:
        description: "Released package to verify exactly: pycubrid, sqlalchemy-cubrid or cubrid-mcp-server"
        type: string
        required: true
      version:
        description: "Exact release to verify, MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH"
        type: string
        required: true
      request_id:
        description: "Optional correlation id for the report artifact name, [A-Za-z0-9._-]{8,80}"
        type: string
        default: ""
    outputs:
      status:
        description: "success only when every smoke job passed with the requested version installed"
        value: ${{ jobs.report.outputs.status }}
      requested_version:
        description: "Normalized requested version (MAJOR.MINOR.PATCH)"
        value: ${{ jobs.report.outputs.requested_version }}
      installed_version:
        description: "Version installed by every smoke job, empty unless they all agree"
        value: ${{ jobs.report.outputs.installed_version }}
      artifact:
        description: "Name of the release-verification report artifact in the caller's run"
        value: ${{ jobs.report.outputs.artifact }}

# Release verifications (repository_dispatch, workflow_dispatch pinned to a
# package, or a workflow_call) get their own group per event/package/version/
# request_id/run and are never cancelled, so a push to main cannot cancel an
# in-flight release check, two verifications cannot replace each other while
# pending, and a called run can never share (and deadlock or cancel) the caller's
# group. `inputs` holds the manual or call inputs (github.event is the caller's
# event under workflow_call). Expression-only use of request fields; run: steps
# read them from the event JSON or RELEASE_INPUT_* variables.
concurrency:
  group: >-
    smoke-tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{
    inputs.package || github.event.client_payload.package || 'none' }}-${{
    inputs.version || github.event.client_payload.ref || 'none' }}-${{
    inputs.request_id || github.event.client_payload.request_id || 'none' }}${{
    (github.event_name == 'repository_dispatch' || (inputs.package && inputs.package != 'latest'))
    && format('-run-{0}-{1}', github.run_id, github.run_attempt) || '' }}
  cancel-in-progress: >-
    ${{ !(github.event_name == 'repository_dispatch' || (inputs.package && inputs.package != 'latest')) }}

# Least privilege: this workflow only reads the repo and runs untrusted
# PR-authored example code via `make verify`. A read-only token removes the
# write/approve escalation path if that code reaches the persisted credentials.
permissions:
  contents: read

# Manual (workflow_dispatch) or call (workflow_call) inputs as plain data.
# release_smoke.py reads them only for a workflow call (RELEASE_WORKFLOW_CALL,
# set by the first step of each job); other runs read the event JSON.
env:
  RELEASE_INPUT_PACKAGE: ${{ inputs.package }}
  RELEASE_INPUT_VERSION: ${{ inputs.version }}
  RELEASE_INPUT_REQUEST_ID: ${{ inputs.request_id }}

jobs:
  verify:
    name: Smoke Tests (CUBRID ${{ matrix.cubrid }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cubrid: ["11.2", "11.4"]
    steps:
      - name: Detect release workflow call
        # A called job's github context is the caller's; job.workflow_ref/_sha/
        # _repository name the workflow file that defines this job. The refs differ
        # only under workflow_call. (Read via toJSON(job): actionlint 1.7.12 does
        # not know these newer job context properties yet.)
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          printf 'Event: %s\n' "$GITHUB_EVENT_NAME"
          JOB_WORKFLOW_REF=$(jq -r '.workflow_ref // ""' <<< "$JOB_CONTEXT")
          JOB_WORKFLOW_REPOSITORY=$(jq -r '.workflow_repository // ""' <<< "$JOB_CONTEXT")
          JOB_WORKFLOW_SHA=$(jq -r '.workflow_sha // ""' <<< "$JOB_CONTEXT")
          if [ -z "$JOB_WORKFLOW_REF" ]; then
            echo "::error::job.workflow_ref is unavailable; cannot tell a workflow call apart"
            exit 1
          fi
          if [ "$JOB_WORKFLOW_REF" = "$CALLER_WORKFLOW_REF" ]; then
            exit 0
          fi
          # Test exactly the cookbook commit the caller pinned, never its own repo.
          if [ "$JOB_WORKFLOW_REPOSITORY" != "cubrid-lab/cubrid-cookbook-python" ] \
            || ! printf '%s' "$JOB_WORKFLOW_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::Unexpected called workflow $JOB_WORKFLOW_REPOSITORY@$JOB_WORKFLOW_SHA"
            exit 1
          fi
          printf 'Called by %s; testing cubrid-lab/cubrid-cookbook-python@%s\n' \
            "$CALLER_WORKFLOW_REF" "$JOB_WORKFLOW_SHA"
          {
            echo "RELEASE_WORKFLOW_CALL=true"
            echo "COOKBOOK_COMMIT=$JOB_WORKFLOW_SHA"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A workflow call runs in the caller's context: check out this
          # repository at the called workflow's own commit, not the caller's repo.
          repository: ${{ env.RELEASE_WORKFLOW_CALL == 'true' && 'cubrid-lab/cubrid-cookbook-python' || github.repository }}
          ref: ${{ env.COOKBOOK_COMMIT }}
          # Do not persist GITHUB_TOKEN in .git/config: `make verify` runs
          # untrusted PR example code, which must not be able to read the token.
          persist-credentials: false

      - name: Select verify scope
        env:
          # A called run always verifies everything (the caller's PR is not ours).
          EVENT_NAME: ${{ env.RELEASE_WORKFLOW_CALL == 'true' && 'workflow_call' || github.event_name }}
        run: |
          # Every event this workflow runs on (push to main, cron, upstream
          # release, manual dispatch, workflow call) verifies the full suite: a
          # dependency bump or scheduled run must exercise every example.
          # Pull-request scoping lives in scripts/ci_scope.py (ci.yml).
          echo "VERIFY_PATHS=." >> "$GITHUB_ENV"
          echo "Full verify (event=$EVENT_NAME)"

      - name: Start CUBRID container
        run: |
          # Started before dependency install so the image pull and engine
          # initialization overlap with pip install instead of running serially;
          # the readiness gate below then usually finds the engine already up.
          original_id=$(docker run -d --name cubrid --shm-size 512m \
            --label cookbook.smoke.role=original \
            -e CUBRID_DB=testdb \
            -p 33000:33000 -p 1523:1523 \
            cubrid/cubrid:${{ matrix.cubrid }})
          printf '%s\n' "$original_id" > "$RUNNER_TEMP/cubrid-original-id"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check golden coverage
        # Guard against issue #89: a script inside an expected/-owning directory
        # with no matching .expected golden is silently never run by make verify.
        # Always full-repo (not scoped) and needs no database.
        run: python scripts/check_expected_coverage.py

      - name: Check release smoke guards (offline)
        run: python -m unittest discover -s tests -p 'test_release*.py' -v

      - name: Check Make and readiness guards (offline)
        run: |
          python -m unittest discover -s tests -p 'test_make_commands.py' -v
          python -m unittest discover -s tests -p 'test_wait_for_cubrid.py' -v

      - name: Cache pip downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          # Rolling key: the target packages float to their latest release, so
          # this caches downloaded wheels (pandas, matplotlib, numpy, sqlalchemy)
          # without pinning versions. pip still queries PyPI for newer releases.
          key: pip-smoke-${{ runner.os }}-${{ hashFiles('.github/workflows/smoke-test.yml') }}
          restore-keys: |
            pip-smoke-${{ runner.os }}-

      - name: Select released drivers
        timeout-minutes: 10
        run: |
          # Reads the event JSON directly; untrusted payload fields and manual
          # inputs never enter shell code. Requested releases (repository_dispatch
          # or a pinned workflow_dispatch) get six bounded PyPI attempts, with no
          # artifact or latest-release fallback.
          python scripts/release_smoke.py select \
            --constraints "$RUNNER_TEMP/release-constraints.txt"

      - name: Freeze selected driver releases
        run: |
          python scripts/release_smoke.py freeze \
            --state "$RUNNER_TEMP/release-drivers.json" \
            --constraints "$RUNNER_TEMP/release-constraints.txt"
          # All later pip installs, including transitive dependencies and the
          # intentional MCP git-tag fallback, must preserve the chosen releases.
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/release-constraints.txt" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          # PIP_CONSTRAINT keeps the selected drivers fixed during every install.
          pip install pandas matplotlib
          # Requested MCP was selected exactly; fallback is only for non-requested MCP.
          python scripts/release_smoke.py install-mcp --state "$RUNNER_TEMP/release-drivers.json"

      - name: Wait for CUBRID readiness
        run: |
          # Use the in-container csql check (same as docker-compose healthcheck)
          # rather than a client connect; the broker accepts external TCP
          # connections slightly after the engine itself is ready.
          for i in $(seq 1 60); do
            if docker exec cubrid bash -lc "csql -u dba testdb -c 'SELECT 1;'" >/dev/null 2>&1; then
              echo "CUBRID testdb is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for CUBRID testdb... attempt $i/60"
            sleep 5
          done
          echo "CUBRID testdb did not become ready in time"
          docker logs cubrid || true
          exit 1

      - name: Verify external client connectivity
        run: |
          # The csql check only proves the in-container engine is up; the broker
          # accepts external TCP on the mapped port slightly later. Confirm a real
          # pycubrid client (the same path the examples use) can connect before
          # running make verify, otherwise the first example races the broker.
          python - <<'PY'
          import sys
          import time
          import os

          import pycubrid

          last_error = None
          for attempt in range(1, 31):
              try:
                  conn = pycubrid.connect(
                      host="localhost",
                      port=33000,
                      database="testdb",
                      user="dba",
                      password="",
                  )
                  cursor = conn.cursor()
                  cursor.execute("SELECT 1")
                  cursor.fetchone()
                  cursor.close()
                  server_version = conn.get_server_version().replace("\n", " ").replace("\r", " ")
                  conn.close()
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
                      output.write(f"CUBRID_SERVER_VERSION={server_version}\n")
                  print(f"External pycubrid connection OK (attempt {attempt})")
                  sys.exit(0)
              except Exception as error:
                  last_error = error
                  print(f"Waiting for external broker... attempt {attempt}/30: {error}")
                  time.sleep(3)

          print(f"External broker not reachable in time: {last_error}")
          sys.exit(1)
          PY

      - name: Install AI agent test dependencies
        # PIP_CONSTRAINT preserves the selected released drivers on PRs too.
        run: pip install pytest

      - name: Install per-example dependencies
        # Golden-verified examples may declare their own requirements.txt (e.g.
        # fundamentals/alembic needs alembic). Install the requirements of every
        # example root that owns an expected/ folder so `make verify` can import
        # them. Every install uses the exact selected driver-release constraints;
        # incompatible requirements fail rather than replacing a tested release.
        run: |
          python scripts/release_smoke.py install-examples --constraints "$PIP_CONSTRAINT"

      - name: Install pytest suite dependencies (non-PR runs only)
        # Pull requests skip the full pytest suites; ci.yml exercises representative
        # recipes. Install all dependencies before recording the tested versions.
        if: github.event_name != 'pull_request' || env.RELEASE_WORKFLOW_CALL == 'true'
        # One explicit list avoids conflicting pins in individual recipe files.
        # PIP_CONSTRAINT also covers these packages' transitive driver requirements.
        run: pip install flask flask-sqlalchemy fastapi email-validator httpx pytest pytest-asyncio streamlit pandas -r templates/async-worker/requirements.txt -r templates/django/requirements.txt -r templates/api-service-fastapi/requirements.txt

      - name: Record tested versions
        run: |
          set -o pipefail
          # Fail if a driver version or package-index provenance changed, including
          # a same-version VCS/local replacement. Only then publish the summary.
          python scripts/release_smoke.py verify \
            --state "$RUNNER_TEMP/release-drivers.json" --report \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test AI agent examples against live CUBRID
        timeout-minutes: 5
        env:
          CUBRID_TEST_URL: cubrid+pycubrid://dba@localhost:33000/testdb
        run: |
          # Every dependency is installed and final driver provenance verified.
          python -m pytest tests/test_ai_agent_offline.py -q
          # Each example has dedicated table cleanup. Repeat to catch stale
          # fixed demonstration keys and incomplete teardown on the same server.
          python -m pytest tests/test_ai_agent.py -v --tb=short
          python -m pytest tests/test_ai_agent.py -v --tb=short

      - name: Run make verify
        run: make verify VERIFY_PATHS="${VERIFY_PATHS:-.}"

      - name: Smoke test cubrid-mcp-server
        # Real-usage tool-surface smoke; the contract lives in scripts/mcp_smoke.py
        # and is shared with the ci.yml pull-request smoke lanes.
        run: python scripts/mcp_smoke.py

      - name: Run Flask and FastAPI pytest suites (non-PR runs only)
        if: github.event_name != 'pull_request' || env.RELEASE_WORKFLOW_CALL == 'true'
        # Each suite's tests/conftest.py switches to live CUBRID when
        # CUBRID_TEST_URL is set, so these run against the container started above.
        # Every recipe imports its own app/database/main/models modules, so each
        # suite needs a separate pytest process. All suites run even after a
        # failure, then the step fails if any did; pytest exits non-zero when a
        # suite collects no tests, so an empty suite cannot pass silently. The
        # glob skips the nested templates/flask/*/01-basic-crud copies. pytest
        # runs without -q so each log shows the conftest's "database: live
        # CUBRID" header.
        #
        # The dashboard suite shares cookbook_products with Flask and owns
        # cookbook_sales with an FK to it. It runs only after this original
        # database is stopped and a separate container is ready below (#142).
        timeout-minutes: 15
        env:
          CUBRID_TEST_URL: cubrid+pycubrid://dba@localhost:33000/testdb
          CUBRID_VERSION: ${{ matrix.cubrid }}
        run: |
          shopt -s nullglob
          suites=(templates/flask/*/tests templates/api-service-fastapi/tests templates/api-service-fastapi/recipes/*/tests)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::No pytest suites found"
            exit 1
          fi

          log=$(mktemp)
          failed=()
          {
            printf '### pytest suites against CUBRID %s\n\n' "$CUBRID_VERSION"
            printf '| Suite | Result |\n| --- | --- |\n'
          } >> "$GITHUB_STEP_SUMMARY"

          for suite in "${suites[@]}"; do
            echo "::group::pytest $suite"
            status=0
            python -m pytest "$suite" > "$log" 2>&1 || status=$?
            cat "$log"
            echo "::endgroup::"
            result=$(tail -n 1 "$log" | sed -E 's/=+//g; s/ in [0-9.]+s//; s/^ +| +$//g')
            if [ "$status" -ne 0 ]; then
              failed+=("$suite")
              echo "::error::pytest failed in $suite (exit $status): $result"
              result="FAILED: $result"
            fi
            printf '| %s | %s |\n' "$suite" "$result" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "Ran ${#suites[@]} pytest suites; ${#failed[@]} failed."
          if [ "${#failed[@]}" -ne 0 ]; then
            exit 1
          fi

      - name: Run async-worker database tasks (non-PR runs only)
        if: github.event_name != 'pull_request' || env.RELEASE_WORKFLOW_CALL == 'true'
        # make verify has finished, including the pycubrid example that also
        # uses cookbook_jobs with a different schema. The worker suite refuses
        # to delete a preexisting worker table and cleans up only its own four.
        timeout-minutes: 5
        env:
          CUBRID_TEST_URL: cubrid+pycubrid://dba@localhost:33000/testdb
        run: python -m pytest templates/async-worker/tests -v --tb=short

      - name: Run Django SQLAlchemy bridge (non-PR runs only)
        if: github.event_name != 'pull_request' || env.RELEASE_WORKFLOW_CALL == 'true'
        # cookbook_items is also used by the migration and FastAPI recipes.
        # Both make verify and Flask/FastAPI suites must finish first; this
        # suite refuses to delete a preexisting table.
        timeout-minutes: 5
        env:
          CUBRID_TEST_URL: cubrid+pycubrid://dba@localhost:33000/testdb
        run: python -m pytest templates/django/tests -v --tb=short

      - name: Start isolated dashboard CUBRID (non-PR runs only)
        if: github.event_name != 'pull_request' || env.RELEASE_WORKFLOW_CALL == 'true'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          original_id=$(< "$RUNNER_TEMP/cubrid-original-id")
          if [[ ! "$original_id" =~ ^[0-9a-f]{64}$ ]] \
            || [ "$(docker inspect -f '{{.Name}}' "$original_id")" != /cubrid ] \
            || [ "$(docker inspect -f '{{index .Config.Labels "cookbook.smoke.role"}}' "$original_id")" != original ]; then
            echo "::error::Refusing to stop a container not owned by this smoke job"
            exit 1
          fi
          docker stop --timeout 10 "$original_id"

          # Reuse this matrix cell's image and host ports, but never its schema.
          # No volume is attached; this container belongs only to this run.
          dashboard_id=$(docker run -d --name cubrid-dashboard --shm-size 512m \
            --label cookbook.smoke.role=dashboard \
            -e CUBRID_DB=testdb \
            -p 33000:33000 -p 1523:1523 \
            cubrid/cubrid:${{ matrix.cubrid }})
          printf '%s\n' "$dashboard_id" > "$RUNNER_TEMP/cubrid-dashboard-id"

      - name: Wait for isolated dashboard CUBRID
        if: github.event_name != 'pull_request' || env.RELEASE_WORKFLOW_CALL == 'true'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          dashboard_id=$(< "$RUNNER_TEMP/cubrid-dashboard-id")
          if [[ ! "$dashboard_id" =~ ^[0-9a-f]{64}$ ]] \
            || [ "$(docker inspect -f '{{.Name}}' "$dashboard_id")" != /cubrid-dashboard ] \
            || [ "$(docker inspect -f '{{index .Config.Labels "cookbook.smoke.role"}}' "$dashboard_id")" != dashboard ]; then
            echo "::error::Dashboard readiness target is not this job's container"
            exit 1
          fi

          ready=0
          for attempt in {1..30}; do
            if timeout 5s docker exec "$dashboard_id" bash -lc "csql -u dba testdb -c 'SELECT 1;'" >/dev/null 2>&1; then
              echo "Dashboard CUBRID engine ready (attempt $attempt)"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Dashboard CUBRID csql readiness exhausted"
            docker logs --tail 50 "$dashboard_id" || true
            exit 1
          fi

          # csql can succeed before the mapped broker accepts real clients.
          python - <<'PY'
          import sys
          import time

          import pycubrid

          last_error = None
          for attempt in range(1, 31):
              connection = None
              try:
                  connection = pycubrid.connect(
                      host="localhost", port=33000, database="testdb",
                      user="dba", password="", connect_timeout=5, read_timeout=5,
                  )
                  cursor = connection.cursor()
                  cursor.execute("SELECT 1")
                  if cursor.fetchone() != (1,):
                      raise RuntimeError("dashboard broker SELECT 1 returned an unexpected row")
                  cursor.close()
                  print(f"Dashboard external broker ready (attempt {attempt})")
                  sys.exit(0)
              except Exception as error:
                  last_error = error
                  print(f"Waiting for dashboard broker {attempt}/30: {error}")
                  time.sleep(2)
              finally:
                  if connection is not None:
                      connection.close()
          print(f"Dashboard external broker did not become ready: {last_error}")
          sys.exit(1)
          PY

      - name: Run isolated Streamlit dashboard pytest suite
        if: github.event_name != 'pull_request' || env.RELEASE_WORKFLOW_CALL == 'true'
        timeout-minutes: 5
        env:
          CUBRID_TEST_URL: cubrid+pycubrid://dba@localhost:33000/testdb
        run: python -m pytest templates/dashboard/tests -v --tb=short

      - name: Remove owned dashboard CUBRID container
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/cubrid-dashboard-id" ]; then
            exit 0
          fi
          dashboard_id=$(< "$RUNNER_TEMP/cubrid-dashboard-id")
          if [[ ! "$dashboard_id" =~ ^[0-9a-f]{64}$ ]] \
            || [ "$(docker inspect -f '{{.Name}}' "$dashboard_id")" != /cubrid-dashboard ] \
            || [ "$(docker inspect -f '{{index .Config.Labels "cookbook.smoke.role"}}' "$dashboard_id")" != dashboard ]; then
            echo "::error::Refusing to remove a container not owned by this smoke job"
            exit 1
          fi
          docker rm -f "$dashboard_id"

      - name: Report release smoke result
        if: always()
        env:
          SMOKE_RESULT: ${{ job.status }}
          CUBRID_VERSION: ${{ matrix.cubrid }}
        run: |
          set -o pipefail
          # Release requests also write this job's machine-readable result.
          python scripts/release_smoke.py summary \
            --state "$RUNNER_TEMP/release-drivers.json" \
            --result "$SMOKE_RESULT" \
            --part "$RUNNER_TEMP/release-verification-part.json" \
            --cubrid "$CUBRID_VERSION" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload release verification result
        # Only release requests write the file; other runs upload nothing.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-part-cubrid-${{ matrix.cubrid }}
          path: ${{ runner.temp }}/release-verification-part.json
          if-no-files-found: ignore
          retention-days: 7
          # A re-run of a failed job replaces its earlier result.
          overwrite: true

  report:
    # One result per release request for the upstream release workflow: the job
    # summary, step outputs and the release-verification-<request_id> artifact
    # (schema in CONTRIBUTING.md). Fails unless every smoke job passed with the
    # requested version installed. Pull requests, pushes and the schedule skip it.
    name: Release verification report
    needs: verify
    # The package input is set only for manual runs and workflow calls.
    if: ${{ always() && (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || inputs.package != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read by workflow_call callers (see on.workflow_call.outputs).
    outputs:
      status: ${{ steps.report.outputs.status }}
      requested_version: ${{ steps.report.outputs.requested_version }}
      installed_version: ${{ steps.report.outputs.installed_version }}
      artifact: ${{ steps.report.outputs.artifact }}
    steps:
      - name: Detect release workflow call
        # A called job's github context is the caller's; job.workflow_ref/_sha/
        # _repository name the workflow file that defines this job. The refs differ
        # only under workflow_call. (Read via toJSON(job): actionlint 1.7.12 does
        # not know these newer job context properties yet.)
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          printf 'Event: %s\n' "$GITHUB_EVENT_NAME"
          JOB_WORKFLOW_REF=$(jq -r '.workflow_ref // ""' <<< "$JOB_CONTEXT")
          JOB_WORKFLOW_REPOSITORY=$(jq -r '.workflow_repository // ""' <<< "$JOB_CONTEXT")
          JOB_WORKFLOW_SHA=$(jq -r '.workflow_sha // ""' <<< "$JOB_CONTEXT")
          if [ -z "$JOB_WORKFLOW_REF" ]; then
            echo "::error::job.workflow_ref is unavailable; cannot tell a workflow call apart"
            exit 1
          fi
          if [ "$JOB_WORKFLOW_REF" = "$CALLER_WORKFLOW_REF" ]; then
            exit 0
          fi
          # Test exactly the cookbook commit the caller pinned, never its own repo.
          if [ "$JOB_WORKFLOW_REPOSITORY" != "cubrid-lab/cubrid-cookbook-python" ] \
            || ! printf '%s' "$JOB_WORKFLOW_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::Unexpected called workflow $JOB_WORKFLOW_REPOSITORY@$JOB_WORKFLOW_SHA"
            exit 1
          fi
          printf 'Called by %s; testing cubrid-lab/cubrid-cookbook-python@%s\n' \
            "$CALLER_WORKFLOW_REF" "$JOB_WORKFLOW_SHA"
          {
            echo "RELEASE_WORKFLOW_CALL=true"
            echo "COOKBOOK_COMMIT=$JOB_WORKFLOW_SHA"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A workflow call runs in the caller's context: check out this
          # repository at the called workflow's own commit, not the caller's repo.
          repository: ${{ env.RELEASE_WORKFLOW_CALL == 'true' && 'cubrid-lab/cubrid-cookbook-python' || github.repository }}
          ref: ${{ env.COOKBOOK_COMMIT }}
          persist-credentials: false

      - name: Download smoke job results
        # A missing result makes the report fail below, never pass.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-verification-part-*
          path: ${{ runner.temp }}/release-verification-parts

      - name: Report release verification
        id: report
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -o pipefail
          # Reads and validates the request like the smoke jobs (event JSON, or
          # RELEASE_INPUT_* under a workflow call).
          python3 scripts/release_smoke.py report \
            --parts "$RUNNER_TEMP/release-verification-parts" \
            --verify-result "$VERIFY_RESULT" \
            --output "$RUNNER_TEMP/release-verification/release-verification.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload release verification report
        if: ${{ always() && steps.report.outputs.release == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.report.outputs.artifact }}
          path: ${{ runner.temp }}/release-verification/release-verification.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
