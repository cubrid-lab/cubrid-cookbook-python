name: PR title

# Enforces the cubrid-lab title rule (CONTRIBUTING.md, "Pull request and
# commit titles"). The PR title becomes the squash commit title on main.
#
# Security: runs on `pull_request` (never `pull_request_target`), checks out
# nothing and receives the title and body only through environment variables, so
# no PR-controlled code or string is executed. The job's token can only read pull
# requests: `gh api` lists the PR's commit messages into a file that is read as
# data only. Also rejects foreign-issue closing keywords in the PR body, and in
# the title and commit messages, which make up the squash commit.
# The job name "PR title" is the required-status-check context; keep it stable.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export PR_COMMITS_FILE="$RUNNER_TEMP/pr-commit-messages.txt"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[].commit.message + "\u0000"' > "$PR_COMMITS_FILE"
          python3 - <<'PY'
          # BEGIN pr-title-validator
          import html
          import os
          import re
          import sys

          TYPES = (
              "feat", "fix", "docs", "test", "perf", "refactor",
              "ci", "build", "chore", "style", "revert",
          )
          HEADER = re.compile(
              r"(?P<type>[^\s(!:]+)(?:\((?P<scope>[^()]*)\))?(?P<bang>!)?: (?P<desc>.*)",
              re.DOTALL,
          )
          SCOPE = re.compile(r"[a-z0-9][a-z0-9_-]*")
          HELP = (
              "Format: type: description | type(scope): description | "
              "type!: description | type(scope)!: description",
              "Allowed types: " + ", ".join(TYPES),
              "Examples: 'fix: preserve cursor state after END_TRAN',"
              " 'feat(aio): add charset connection option',"
              " 'refactor(compiler)!: drop legacy LIMIT rendering'",
              "Put issue references in the PR body (Closes #123 / Refs #123), not the title.",
              "Rule: CONTRIBUTING.md, section 'Pull request and commit titles'.",
          )

          title = os.environ.get("PR_TITLE", "")
          errors = []
          warnings = []
          match = HEADER.fullmatch(title)
          if match is None:
              errors.append(
                  "Title must be 'type: description', 'type(scope): description', "
                  "'type!: description', or 'type(scope)!: description' with a "
                  "lowercase type and one space after the colon."
              )
          else:
              kind, scope, desc = match["type"], match["scope"], match["desc"]
              if kind not in TYPES:
                  hint = " (use lowercase)" if kind.lower() in TYPES else ""
                  errors.append(f"Unknown type '{kind}'{hint}.")
              if scope is not None and SCOPE.fullmatch(scope) is None:
                  errors.append(
                      f"Scope '{scope}' must be lowercase letters, digits, '-' or '_'."
                  )
              if not desc.strip():
                  errors.append("Description is empty.")
              elif desc[0].isspace():
                  errors.append("Use exactly one space after the colon.")
              if desc.rstrip() != desc:
                  errors.append("Remove trailing whitespace.")
              if desc.endswith("."):
                  errors.append("Do not end the title with a period.")
              first = desc.split(" ", 1)[0]
              if re.fullmatch(r"[A-Z][a-z]+", first):
                  warnings.append(
                      f"Description starts with '{first}'; start lowercase unless it is "
                      "a proper noun or API name."
                  )
          if re.search(r"#\d+", title):
              errors.append("Do not put issue or PR numbers in the title.")
          if re.search(r"\bwip\b", title, re.IGNORECASE):
              errors.append("Do not mark work in progress in the title; open a draft PR.")
          if any(ch.isalpha() and not ch.isascii() for ch in title):
              errors.append("Write the title in English (ASCII letters only).")


          # BEGIN cross-repo-closing-guard
          # No checkout or execution of untrusted PR-body text is needed.
          # Raw HTML block starts with an end other than a blank line (CommonMark
          # types 1, 3, 4 and 5); any other line starting with a tag is raw HTML
          # until a blank line, which may run longer than GitHub's block.
          RAW_HTML_ENDS = (
              (
                  r"(?i:<(?:script|pre|style|textarea))(?:[ \t\x0b\x0c>]|$)",
                  r"(?i:</(?:script|pre|style|textarea)>)",
              ),
              (r"<\?", r"\?>"),
              (r"<![A-Z]", r">"),
              (r"<!\[CDATA\[", r"\]\]>"),
          )
          # Lines that cannot be a lazy continuation of a list item's paragraph.
          BLOCK_START = re.compile(r" {0,3}(?:#{1,6}(?:[ \t]|$)|>|<!--)")
          RAW_TEXT = re.compile(
              r"<(?:script|style|textarea|title|xmp|iframe|noembed|noframes|noscript"
              r"|plaintext|select)(?![a-z0-9-])",
              re.I,
          )

          def strip_inert_markdown(text: str) -> str:
              # Hide only what GitHub never renders as text: fenced and indented
              # code blocks and HTML comment blocks. Anything that needs inline
              # parsing (code spans, inline comments) stays live, and once a fence
              # appears where its extent is unknown (a list item, a quote, raw HTML)
              # no later fence or comment is hidden: a false positive only asks for
              # a body edit, a false negative closes a foreign issue.
              output = []
              fence = None  # Character and length of the open fenced code block.
              # False after any fence-like line that is not tracked as a top-level
              # fence (in a list, a quote or raw HTML): its end is unknown.
              fences_inert = True
              raw_end = None  # End rule of the raw HTML block: a regex or "blank".
              in_comment = False
              # False after any HTML tag or untracked fence: an open attribute or
              # raw block could make a later "<!--" render as text.
              comments_inert = True
              after_blank = True  # No open paragraph: indented code may start.
              in_list = False  # Indented text in a list item or footnote is prose.
              list_floor = 0  # Lowest possible content column of the open items.
              # GitHub drops a leading byte order mark and splits lines only at CR
              # and LF; str.splitlines() splits at more characters.
              lines = re.split(r"\r\n|\r|\n", text.removeprefix("\ufeff"))
              for index, line in enumerate(lines):
                  expanded = line.expandtabs(4)
                  stripped = expanded.lstrip(" ")
                  indent = len(expanded) - len(stripped)
                  blank = not stripped.strip(" \t")
                  delimiter = None
                  if indent <= 3:
                      delimiter = re.match(r"\x60{3,}(?!.*\x60)|~{3,}", stripped)
                  if fence is not None:
                      if (
                          delimiter is not None
                          and delimiter.group()[0] == fence[0]
                          and len(delimiter.group()) >= fence[1]
                          and not stripped[delimiter.end():].strip(" \t")
                      ):
                          fence = None
                          after_blank = True
                      continue
                  live = line
                  fence_like = re.match(
                      r"[ >]*(?:(?:[-*+]|[0-9]{1,9}[.)])[ >]+)*(?:\x60{3,}|~{3,})", expanded
                  )
                  if raw_end is not None:  # Raw HTML: no Markdown until the block ends.
                      if in_comment:
                          close = re.search(r"--!?>", line)
                          in_comment = close is None
                          live = "" if close is None else line[close.end():]
                      if raw_end == "blank" and blank:
                          raw_end, after_blank = None, True
                      elif raw_end != "blank" and raw_end.search(line):
                          raw_end, after_blank = None, False
                  else:
                      thematic_break = re.match(
                          r" {0,3}(?:(?:\*[ \t]*){3,}|(?:-[ \t]*){3,}|(?:_[ \t]*){3,})$",
                          expanded,
                      )
                      marker = None
                      if indent <= 3 and thematic_break is None:
                          marker = re.match(
                              r"(?:[-*+]|[0-9]{1,9}[.)])(?=[ \t]|$)|\[\^[^\]]+\]:", stripped
                          )
                      if marker is not None:
                          # Footnote text needs 4 spaces; use 1 so it never ends early.
                          width = 0 if marker.group()[0] == "[" else len(marker.group())
                          column = indent + width + 1
                          list_floor = min(list_floor, column) if in_list else column
                          in_list = True
                      elif in_list and not blank and indent < list_floor and (
                          after_blank
                          or delimiter is not None
                          or thematic_break is not None
                          or BLOCK_START.match(expanded)
                      ):
                          in_list = False  # Outside every item and not a lazy continuation.
                      if indent >= 4 and after_blank and not in_list and not blank:
                          continue  # Indented code is inert.
                      if delimiter is not None and fences_inert and not in_list:
                          fence = (delimiter.group()[0], len(delimiter.group()))
                          continue
                      if indent <= 3 and stripped.startswith("<!--"):
                          raw_end = None if "-->" in line else re.compile("-->")
                          if comments_inert and not in_list:
                              start = line.index("<!--")
                              close = re.compile(r"--!?>").search(line, start + 2)
                              in_comment = close is None
                              live = "" if close is None else line[close.end():]
                          after_blank = False
                      elif indent <= 3 and re.match(r"(?i:<(?:[a-z/?]|![a-z\[]))", stripped):
                          raw_end = "blank"
                          for opener, closer in RAW_HTML_ENDS:
                              if re.match(opener, stripped):
                                  raw_end = re.compile(closer)
                          if raw_end != "blank" and raw_end.search(line):
                              raw_end = None
                          after_blank = False
                      else:
                          heading = re.match(r" {0,3}#{1,6}(?:[ \t]|$)", expanded)
                          after_blank = blank or heading is not None
                  if fence_like is not None:
                      fences_inert = comments_inert = False
                  output.append(live + "\n")
                  if re.search(r"<(?:[a-z/?]|!(?!--))", live, re.I):
                      comments_inert = False
                  if RAW_TEXT.search(live):
                      # A raw text element shows the code and comments after it as text.
                      return "".join(output) + "\n".join(lines[index + 1:])
              return "".join(output)

          body = strip_inert_markdown(os.environ.get("PR_BODY", ""))
          # Escapes and entities render as the plain characters they stand for.
          body = html.unescape(re.sub(r"\\([!-/:-@\[-\x60{-~])", r"\1", body))
          tag = re.compile(r"</?[a-z][a-z0-9-]*(?:\s(?:[^<>\"']|\"[^\"]*\"|'[^']*')*)?/?>", re.I)
          inline_hidden = re.compile(r"<!--|<\?|<!\[CDATA\[|<![a-z]", re.I)
          # cmark-gfm ends these at the closer; a browser ends "<?" and "<![CDATA["
          # at the first ">". Both ends are tried.
          closers = {"<!--": ("-->", "--!>"), "<?": ("?>", ">"), "<![CDATA[": ("]]>", ">")}
          # ">" also joins quoted lines: "> Closes\n> owner/repo#N" is one paragraph.
          separator = re.compile(r"[\s:*_~\[(<>\\]")
          definition = re.compile(r"\n[ ]{0,3}\[[^\]\n]+\]:[^\n]*")  # Renders as nothing.
          keyword = re.compile(
              r"(?<![a-z0-9])(?:closes|closed|close|fixes|fixed|fix|resolves|resolved|resolve)"
              r"(?![a-z0-9])",
              re.I | re.A,
          )
          reference = re.compile(
              r"(?:(?:https?://)?(?:www\.)?github\.com/)?"
              r"(?:(?P<owner>[a-z0-9][a-z0-9_-]*)/(?P<repo>[a-z0-9_.-]+)(?:#|/issues/)|#|gh-)"
              r"(?P<number>[0-9]+)(?![0-9])",
              re.I | re.A,
          )
          next_ref = re.compile(r"[\s*_~)\]>]*(?:,|&|\band\b)[\s*_~\[(<\\]*", re.I)
          # An absolute or relative ("/o/r/issues/N", "../../r/issues/N") issue link.
          issue_link = re.compile(
              r"(?<![a-z0-9_.-])(?P<owner>\.\.|[a-z0-9][a-z0-9_-]*)/(?P<repo>[a-z0-9_.-]+)"
              r"/issues/(?P<number>[0-9]+)",
              re.I | re.A,
          )
          local_repo = os.environ.get("GITHUB_REPOSITORY", "").lower()
          # (Foreign issue, where) -> "direct" or "link", in the order found.
          found = {}
          where = "PR body"

          def note(owner: str, repo: str, number: str, how: str) -> None:
              target = f"{owner}/{repo}".lower()
              if target != local_repo:
                  key = (f"{target}#{number.lstrip('0') or '0'}", where)
                  if found.get(key) != "direct":
                      found[key] = how

          def gap_ends(text: str, start: int, seen: set, scanned: dict) -> tuple[list, bool]:
              # New positions reachable from start over spaces, a colon, emphasis,
              # a hard break, tags and inline comments, instructions or CDATA,
              # which GitHub shows as a gap; and whether a link starts on the way.
              # "seen" is shared by every keyword, so each position is walked once.
              is_link = False
              ends, todo = [], [start]
              while todo:
                  pos = todo.pop()
                  if pos in seen or pos >= len(text):
                      continue
                  seen.add(pos)
                  if pos != start:
                      ends.append(pos)
                  opener = inline_hidden.match(text, pos)
                  if opener is not None:
                      search = pos + 2 if opener.group() == "<!--" else opener.end()
                      jumps = [
                          found_at + len(closer)
                          for closer in closers.get(opener.group(), (">",))
                          if (found_at := text.find(closer, search)) >= 0
                      ]
                      if opener.group() == "<!--":
                          jumps = jumps and [min(jumps)]
                      todo.extend(jumps)
                  markup = tag.match(text, pos)
                  if markup is not None:
                      is_link = is_link or re.match(r"<a[\s>]", markup.group(), re.I) is not None
                      todo.append(markup.end())
                  if separator.match(text, pos):
                      is_link = is_link or text[pos] == "["
                      todo.append(pos + 1)
                  elif text[pos] == "]":
                      # A keyword can be link text: "[Closes](url) owner/repo#N" shows
                      # "Closes owner/repo#N". Skip "]", or a "](destination)" or
                      # "][label]" up to any ")" or "]" in the paragraph.
                      todo.append(pos + 1)
                      closer = {"(": ")", "[": "]"}.get(text[pos + 1 : pos + 2])
                      if closer is not None:
                          todo.extend(closer_ends(text, pos + 2, closer, scanned))
                  line = definition.match(text, pos)
                  if line is not None:
                      todo.append(line.end())
                  if text.startswith("![", pos):
                      # An image shows no text: skip its alt text to any "]" and walk
                      # on from there, through the "](destination)".
                      alt_ends = closer_ends(text, pos + 2, "]", scanned, "![")
                      todo.extend(end - 1 for end in alt_ends)
              return ends, is_link

          def closer_ends(
              text: str, start: int, closer: str, scanned: dict, kind: str = ""
          ) -> list:
              # Positions after each closer from start to the end of the paragraph.
              # A later start reaches a subset of an earlier one's closers, so each
              # closer is scanned once per check.
              stop = text.find("\n\n", start)
              stop = len(text) if stop < 0 else stop
              low = scanned.get((kind + closer, stop), stop)
              scanned[(kind + closer, stop)] = min(low, start)
              ends = []
              found_at = text.find(closer, start, low)
              while found_at >= 0:
                  ends.append(found_at + 1)
                  found_at = text.find(closer, found_at + 1, low)
              return ends

          def check(text: str) -> None:
              links = False
              seen, scanned = set(), {}
              for word in keyword.finditer(text):
                  ends, is_link = gap_ends(text, word.end(), seen, scanned)
                  links = links or is_link
                  for pos in ends:
                      match = reference.match(text, pos)
                      while match is not None:  # "Closes #1, owner/repo#2" closes both.
                          if match["owner"]:
                              note(match["owner"], match["repo"], match["number"], "direct")
                          more = next_ref.match(text, match.end())
                          match = reference.match(text, more.end()) if more else None
              if links:
                  # A link's text hides its target, which a definition or nested
                  # brackets can place anywhere: any foreign issue link may be it.
                  for match in issue_link.finditer(text):
                      # "../../repo" from a PR page stays under the same owner.
                      owner = match["owner"]
                      if owner == "..":
                          owner = local_repo.split("/")[0]
                      note(owner, match["repo"], match["number"], "link")

          def without_markup(text: str, instruction_end: str, cdata_end: str) -> str:
              hidden = (
                  r"<!--(?:(?!<!--).)*?--!?>|<![a-z][^<>]*>"
                  rf"|<\?(?:(?!<\?).)*?{instruction_end}"
                  rf"|<!\[CDATA\[(?:(?!<!\[CDATA\[).)*?{cdata_end}"
              )
              text = re.sub(hidden, "", text, flags=re.I | re.S)
              # "_" inside a word is not emphasis and may belong to an owner name.
              return re.sub(r"[*~]|(?<![a-z0-9])_|_(?![a-z0-9])", "", tag.sub("", text), flags=re.I)

          # The PR title and the commit messages form the squash commit, which GitHub
          # reads as plain text: no code or comment block is exempt there and no
          # entity is decoded. Each commit message is checked on its own.
          sources = [("PR body", body), ("PR title", title)]
          commits_file = os.environ.get("PR_COMMITS_FILE")
          if commits_file:
              if int(os.environ.get("PR_COMMIT_COUNT") or 0) >= 250:
                  errors.append(
                      "The PR has 250 or more commits; GitHub lists only 250, so their "
                      "messages cannot all be checked for foreign issue closures."
                  )
              with open(commits_file, encoding="utf-8") as handle:
                  messages = handle.read().split("\0")
              sources += [("commit message", message) for message in messages]
          for where, text in sources:
              check(text)
              # Without markup and emphasis, "Close**s**" and "Clo<b>ses</b>" read
              # "Closes". Strip with cmark-gfm's closers, then with a browser's ">".
              check(without_markup(text, r"\?>", r"\]\]>"))
              check(without_markup(text, ">", ">"))
          for (issue, where), how in found.items():
              if how == "direct":
                  errors.append(
                      f"Cross-repository issue closure of {issue} in a {where} is "
                      f"forbidden; use 'Refs {issue}' and let its own repo close it."
                  )
              else:
                  errors.append(
                      f"Cross-repository issue closure through a link in a {where}: a "
                      f"closing keyword is followed by a link and the text links {issue}. "
                      f"Write local closures as 'Closes #N' and cite {issue} as "
                      f"'Refs {issue}'."
                  )
          # END cross-repo-closing-guard

          for message in warnings:
              print(f"::warning title=PR title::{message}")
          for message in errors:
              print(f"::error title=PR title::{message}")
          if errors:
              print(f"Title: {title!r}")
              for line in HELP:
                  print(line)
              sys.exit(1)
          print(f"PR title OK: {title}")
          # END pr-title-validator
          PY
