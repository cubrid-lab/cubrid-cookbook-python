name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.4
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  docs-sync:
    name: Docs sync gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run doctests
        run: python3 -m doctest scripts/check_docs_sync.py -v
      - name: Check examples are documented
        run: python3 scripts/check_docs_sync.py

  doc-lint:
    name: Documentation lint
    uses: cubrid-lab/.github/.github/workflows/doc-lint.yml@main
    with:
      exclude: "node_modules/,typescript/node_modules/,vendor/"
      fail-on-issue: false  # advisory mode during initial rollout
