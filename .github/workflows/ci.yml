name: CI

# Tiered validation (#222). scripts/ci_scope.py classifies the run; live lanes
# start only when selected and ci-gate accepts a skip only where the classifier
# said "false". Pull requests: cheap checks always, then only the touched recipe
# families on CUBRID 11.4 / Python 3.12. Push, the weekly schedule and manual
# runs: Python 3.11-3.14 and CQRS on 11.2 + 11.4 (schedule and manual runs also
# the exact driver floors, #241); smoke-test.yml owns the broad
# 11.2/11.4 goldens and recipe suites there. See CONTRIBUTING.md "CI tiers".
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

# Read-only by default (#237). A job that needs more declares its own grant; a
# called reusable workflow can never receive more than its caller job grants.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.scope.outputs.tier }}
      web: ${{ steps.scope.outputs.web }}
      web_suites: ${{ steps.scope.outputs.web_suites }}
      web_suites_skipped: ${{ steps.scope.outputs.web_suites_skipped }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      async_worker: ${{ steps.scope.outputs.async_worker }}
      django: ${{ steps.scope.outputs.django }}
      cqrs: ${{ steps.scope.outputs.cqrs }}
      cqrs_cubrid: ${{ steps.scope.outputs.cqrs_cubrid }}
      compat: ${{ steps.scope.outputs.compat }}
      python: ${{ steps.scope.outputs.python }}
      smoke_114: ${{ steps.scope.outputs.smoke_114 }}
      smoke_112: ${{ steps.scope.outputs.smoke_112 }}
      verify_paths: ${{ steps.scope.outputs.verify_paths }}
      floors: ${{ steps.scope.outputs.floors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR checks out its merge commit; its first parent is the base tip.
          fetch-depth: 2
          persist-credentials: false

      - name: Classify validation scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            # Diff the tested merge tree against its base. --no-renames lists both
            # sides of a move; core.quotePath=false keeps non-ASCII paths matchable
            # (a still-quoted path matches nothing and fails closed).
            git rev-parse --verify HEAD^2 >/dev/null
            git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
            echo "Changed paths:"
            cat "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          python3 scripts/ci_scope.py --event "$EVENT" < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/scope.txt"
          cat "$RUNNER_TEMP/scope.txt"
          cat "$RUNNER_TEMP/scope.txt" >> "$GITHUB_OUTPUT"
          {
            echo "### CI validation scope"
            echo '```'
            cat "$RUNNER_TEMP/scope.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: ".github/workflows/ci.yml"
          cache-suffix: ${{ github.job }}
      - name: Install ruff
        run: |
          uv pip install --system ruff==0.16.4
          uv pip freeze --system
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  quickstart-tests:
    name: Offline checks (no DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: "quickstart/5min-fastapi/requirements.txt"
          cache-suffix: ${{ github.job }}
      - name: Install existing offline test dependencies
        run: |
          uv pip install --system -r quickstart/5min-fastapi/requirements.txt pytest httpx sqlalchemy ruff==0.16.4
          uv pip freeze --system
      - name: Run the contributor checks without a database
        run: make check

  docs-sync:
    name: Docs sync gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run doctests
        run: python3 -m doctest scripts/check_docs_sync.py -v
      - name: Run pitfalls discovery unit tests
        run: python3 -m unittest discover -s tests -p 'test_docs_sync.py' -v
      - name: Check examples are documented
        run: python3 scripts/check_docs_sync.py

  # Stages the repo docs and builds the MkDocs site with --strict, so a link that
  # breaks when a page is staged under docs/ fails the PR instead of the
  # post-merge Pages deploy (#154). Always on: a PR that only deletes or renames
  # a linked example must still fail here. docs.yml still owns the deploy.
  docs-site:
    name: Docs site build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Same action pins as docs.yml, which builds this site for deployment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: ".github/requirements-docs.txt"
          cache-suffix: ${{ github.job }}
      - name: Install docs tools
        run: |
          uv pip install --system -r .github/requirements-docs.txt
          uv pip freeze --system
      - run: make docs

  doc-lint:
    name: Documentation lint
    # The called doc-lint.yml declares contents: read + pull-requests: read; a
    # caller job must grant both or the workflow fails at startup.
    permissions:
      contents: read
      pull-requests: read
    uses: cubrid-lab/.github/.github/workflows/doc-lint.yml@f7d8c0f6c28392c10306f367de38b40f13eed4b7
    with:
      exclude: "node_modules/,typescript/node_modules/,vendor/"
      fail-on-issue: false  # advisory mode during initial rollout

  # `make verify` is golden-file only and never runs the pytest suites, so
  # recipe-level CUBRID-only breakage ships undetected (#131/#127). This job
  # runs the Flask/FastAPI suites ci_scope.py selects (web_suites, #227) against
  # one live CUBRID 11.4: the changed recipes (up to MAX_WEB_SUITES), plus the
  # representative suites for shared Flask/FastAPI files and wider tiers.
  pytest-suites:
    name: Recipe pytest suites (live CUBRID)
    needs: [classify]
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      cubrid:
        image: cubrid/cubrid:11.4
        env:
          CUBRID_DB: testdb
        ports:
          - 33000:33000
        options: >-
          --shm-size 512m
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Runs PR recipe code: never persist the token.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: "**/requirements.txt"
          cache-suffix: ${{ github.job }}
      - name: Wait for CUBRID to accept connections
        timeout-minutes: 5
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/probe"
          uv pip install -q --python "$RUNNER_TEMP/probe/bin/python" pycubrid
          deadline=$(( $(date +%s) + 180 ))
          until "$RUNNER_TEMP/probe/bin/python" -c "import pycubrid; pycubrid.connect(host='localhost', port=33000, database='testdb', user='dba', password='').close()" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CUBRID did not accept connections within 180s"
              exit 1
            fi
            sleep 5
          done
          echo "CUBRID is ready."
      - name: Run each selected suite in its own venv
        timeout-minutes: 35
        # Recipes share top-level module names (database/models/app) and pin
        # their own dependencies, so each suite gets a fresh venv with only its
        # own requirements.txt and a separate pytest process. The selected roots
        # arrive as a JSON list in an env var, never interpolated into the
        # script. Every suite runs even after a failure; the step then fails if
        # any did, or if a suite passed no test (an all-skipped run proves
        # nothing). The dashboard suite uses a separate job and database because
        # it shares cookbook_products with Flask and adds an FK from
        # cookbook_sales. Changed roots above the MAX_WEB_SUITES cap
        # (SKIPPED) are not run: each gets a warning and a summary line saying
        # it was not validated before merge.
        env:
          SUITES: ${{ needs.classify.outputs.web_suites }}
          SKIPPED: ${{ needs.classify.outputs.web_suites_skipped }}
          CUBRID_TEST_URL: cubrid+pycubrid://dba@localhost:33000/testdb
        run: |
          set -euo pipefail
          # Command substitution, not process substitution, so set -e stops on
          # malformed JSON.
          suites_txt=$(python3 -c 'import json, os; print("\n".join(json.loads(os.environ["SUITES"])))')
          skipped_txt=$(python3 -c 'import json, os; print("\n".join(json.loads(os.environ.get("SKIPPED") or "[]")))')
          mapfile -t suites <<<"$suites_txt"
          mapfile -t skipped <<<"$skipped_txt"
          if [ "${#suites[@]}" -eq 0 ] || [ -z "${suites[0]}" ]; then
            echo "::error::web lane selected but no suite roots were classified"
            exit 1
          fi
          {
            echo "### Recipe pytest suites (CUBRID 11.4)"
            echo
            echo "| Suite | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=()
          index=0
          for root in "${suites[@]}"; do
            index=$((index + 1))
            venv="$RUNNER_TEMP/suite-$index"
            log="$RUNNER_TEMP/suite-$index.log"
            echo "::group::$root"
            status=0
            {
              uv venv "$venv" &&
              uv pip install -q --python "$venv/bin/python" pytest pytest-asyncio httpx -r "$root/requirements.txt" &&
              timeout 600 "$venv/bin/python" -m pytest "$root/tests" -v --tb=short
            } > "$log" 2>&1 || status=$?
            cat "$log"
            echo "::endgroup::"
            last=$(tail -n 1 "$log")
            result=$(sed -E 's/=+//g; s/ in [0-9.]+s.*//; s/^ +| +$//g' <<<"$last")
            # Only pytest's final summary line counts: a test named "...passed"
            # elsewhere in the log must not satisfy the guard.
            if [ "$status" -eq 0 ] && ! grep -qE '[0-9]+ passed' <<<"$last"; then
              status=1
              result="no test passed: $result"
            fi
            if [ "$status" -ne 0 ]; then
              failed+=("$root")
              echo "::error::pytest suite $root failed (exit $status): $result"
              result="FAILED: $result"
            fi
            printf '| %s | %s |\n' "$root" "$result" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Ran ${#suites[@]} suite(s); ${#failed[@]} failed."
          if [ -n "${skipped[0]:-}" ]; then
            {
              echo
              echo "**Not validated before merge** (beyond the MAX_WEB_SUITES cap of changed recipes;"
              echo "run \`gh workflow run smoke-test.yml --ref <branch>\` for their live evidence):"
              echo
              printf -- '- %s\n' "${skipped[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            for root in "${skipped[@]}"; do
              echo "::warning::$root changed but its suite was not run (MAX_WEB_SUITES cap); the representative suites do not cover it"
            done
          fi
          if [ "${#failed[@]}" -ne 0 ]; then
            exit 1
          fi

  dashboard-pytest:
    name: Dashboard pytest suite (isolated CUBRID 11.4)
    needs: [classify]
    if: needs.classify.outputs.dashboard == 'true'
    uses: cubrid-lab/.github/.github/workflows/live-smoke.yml@f7d8c0f6c28392c10306f367de38b40f13eed4b7
    with:
      cubrid-version: "11.4"
      python-version: "3.12"
      cubrid-test-url: "cubrid+pycubrid://dba@localhost:33000/testdb"
      setup-command: >-
        python -m pip install --upgrade pip &&
        pip install pytest -r templates/dashboard/requirements.txt
      test-command: python -m pytest templates/dashboard/tests -v --tb=short

  async-worker-pytest:
    name: Async-worker database tasks (live CUBRID 11.4)
    needs: [classify]
    if: needs.classify.outputs.async_worker == 'true'
    uses: cubrid-lab/.github/.github/workflows/live-smoke.yml@f7d8c0f6c28392c10306f367de38b40f13eed4b7
    with:
      cubrid-version: "11.4"
      python-version: "3.12"
      cubrid-test-url: "cubrid+pycubrid://dba@localhost:33000/testdb"
      setup-command: >-
        python -m pip install --upgrade pip &&
        pip install pytest -r templates/async-worker/requirements.txt
      test-command: python -m pytest templates/async-worker/tests -v --tb=short

  django-bridge-pytest:
    name: Django SQLAlchemy bridge (live CUBRID 11.4)
    needs: [classify]
    if: needs.classify.outputs.django == 'true'
    uses: cubrid-lab/.github/.github/workflows/live-smoke.yml@f7d8c0f6c28392c10306f367de38b40f13eed4b7
    with:
      cubrid-version: "11.4"
      python-version: "3.12"
      cubrid-test-url: "cubrid+pycubrid://dba@localhost:33000/testdb"
      setup-command: >-
        python -m pip install --upgrade pip &&
        pip install pytest -r templates/django/requirements.txt
      test-command: python -m pytest templates/django/tests -v --tb=short

  # Two read-only golden recipes, not the full framework or smoke matrix.
  # Python 3.11-3.14 on push/schedule/dispatch and CI-policy PRs; endpoints
  # 3.11 + 3.14 for compatibility-surface or shared-infrastructure PRs; every
  # other PR relies on the Python 3.12 its selected live lanes already use.
  python-compatibility:
    name: Python compatibility (${{ matrix.python }}, CUBRID 11.4)
    needs: [classify]
    if: needs.classify.outputs.compat == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.classify.outputs.python) }}
    uses: cubrid-lab/.github/.github/workflows/live-smoke.yml@f7d8c0f6c28392c10306f367de38b40f13eed4b7
    with:
      cubrid-version: "11.4"
      python-version: ${{ matrix.python }}
      cubrid-test-url: "cubrid+pycubrid://dba@localhost:33000/testdb"
      setup-command: >-
        python -m pip install --upgrade pip &&
        pip install -r fundamentals/pycubrid/requirements.txt
        -r fundamentals/sqlalchemy/requirements.txt
      test-command: |
        set -euo pipefail
        python -c 'import pycubrid, sqlalchemy, sqlalchemy_cubrid; print(pycubrid.__version__, sqlalchemy.__version__)'
        python -m compileall -q fundamentals quickstart templates
        python fundamentals/pycubrid/01_connect.py | bash scripts/normalize_output.sh | diff -u fundamentals/pycubrid/expected/01_connect.expected -
        python fundamentals/sqlalchemy/01_connect_and_session.py | bash scripts/normalize_output.sh | diff -u fundamentals/sqlalchemy/expected/01_connect_and_session.expected -

  # Recipe 10 has independent pins that broad latest-package smoke cannot validate.
  # 11.2 + 11.4 on push/schedule/dispatch and when its pins or shared live
  # infrastructure change; 11.4 for other recipe-10 PRs; skipped otherwise.
  cqrs-pinned-pytest:
    name: CQRS pinned requirements (CUBRID ${{ matrix.cubrid }})
    needs: [classify]
    if: needs.classify.outputs.cqrs == 'true'
    strategy:
      fail-fast: false
      matrix:
        cubrid: ${{ fromJSON(needs.classify.outputs.cqrs_cubrid) }}
    uses: cubrid-lab/.github/.github/workflows/live-smoke.yml@f7d8c0f6c28392c10306f367de38b40f13eed4b7
    with:
      cubrid-version: ${{ matrix.cubrid }}
      python-version: "3.12"
      cubrid-test-url: "cubrid+pycubrid://dba@localhost:33000/testdb"
      setup-command: >-
        python -m pip install --upgrade pip &&
        python -m pip install -r templates/api-service-fastapi/recipes/10-cqrs-event-sourcing/requirements.txt
      test-command: |
        set -euo pipefail
        python -m pip check
        python -m pip freeze
        python -m pytest templates/api-service-fastapi/recipes/10-cqrs-event-sourcing/tests -v --tb=short

  # Documented driver floors installed exactly, not only checked as text (#241).
  # scripts/driver_floors.py reads each floor set's pins from the recipes' own
  # requirements.txt, installs pycubrid==X / sqlalchemy-cubrid==Y in a separate
  # venv per set and diffs representative goldens against live CUBRID 11.4.
  # Selected by pull requests that change a floor (ci_scope.FLOORS), the weekly
  # schedule and manual runs; not by pushes to main (floors are fixed releases).
  driver-floors:
    name: Driver floors (CUBRID 11.4)
    needs: [classify]
    if: needs.classify.outputs.floors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      cubrid:
        image: cubrid/cubrid:11.4
        env:
          CUBRID_DB: testdb
        ports:
          - 33000:33000
        options: --shm-size 512m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Runs PR example code: never persist the token.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install each documented floor and run its goldens
        # The script waits for the broker (up to 180 s) before the first golden.
        run: python scripts/driver_floors.py run

  # PR smoke lanes (#222). They keep the check names smoke-test.yml used to
  # report on pull requests. They are not required checks themselves: the main
  # ruleset requires only "CI Gate (all checks must pass)" and "PR title" (see
  # "Main branch protection" in CONTRIBUTING.md), and ci-gate enforces these
  # lanes. A lane skipped by the classifier reports "skipped", which ci-gate
  # accepts only when the classifier said false. Two plain jobs instead of a
  # matrix keep each lane's check name stable even when it is skipped.
  smoke-114:
    name: Smoke Tests (CUBRID 11.4)
    needs: [classify]
    if: needs.classify.outputs.smoke_114 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # make verify runs untrusted PR example code: never persist the token.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/pr-smoke
        with:
          cubrid-version: "11.4"
          verify-paths: ${{ needs.classify.outputs.verify_paths }}

  smoke-112:
    name: Smoke Tests (CUBRID 11.2)
    needs: [classify]
    if: needs.classify.outputs.smoke_112 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/pr-smoke
        with:
          cubrid-version: "11.2"
          verify-paths: ${{ needs.classify.outputs.verify_paths }}

  # Advisory only (#239), never part of ci-gate: the weekly schedule also runs
  # representative goldens against pycubrid and sqlalchemy-cubrid `main`
  # (.github/workflows/driver-main.yml; also dispatchable on its own). Its
  # recipe job has continue-on-error and a failure is reported to one tracking
  # issue, so a driver-main break never blocks contributors. issues: write is
  # for that report job only.
  driver-main-advisory:
    name: Driver main advisory
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/driver-main.yml

  # Single aggregate check required by the main ruleset. Fail-closed allow-list:
  # classify and the always-on cheap checks must succeed; every other lane must
  # succeed unless classify marked it not applicable (output exactly "false").
  # A failed, cancelled or unexpectedly skipped lane, or a missing
  # classification, fails the gate.
  ci-gate:
    name: CI Gate (all checks must pass)
    if: always()
    needs: [classify, lint-python, quickstart-tests, docs-sync, docs-site, doc-lint, pytest-suites, dashboard-pytest, async-worker-pytest, django-bridge-pytest, python-compatibility, cqrs-pinned-pytest, driver-floors, smoke-114, smoke-112]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          TIER: ${{ needs.classify.outputs.tier }}
          R_CLASSIFY: ${{ needs.classify.result }}
          R_LINT_PYTHON: ${{ needs.lint-python.result }}
          R_QUICKSTART_TESTS: ${{ needs.quickstart-tests.result }}
          R_DOCS_SYNC: ${{ needs.docs-sync.result }}
          R_DOC_LINT: ${{ needs.doc-lint.result }}
          R_DOCS_SITE: ${{ needs.docs-site.result }}
          R_PYTEST_SUITES: ${{ needs.pytest-suites.result }}
          W_PYTEST_SUITES: ${{ needs.classify.outputs.web }}
          R_DASHBOARD_PYTEST: ${{ needs.dashboard-pytest.result }}
          W_DASHBOARD_PYTEST: ${{ needs.classify.outputs.dashboard }}
          R_ASYNC_WORKER_PYTEST: ${{ needs.async-worker-pytest.result }}
          W_ASYNC_WORKER_PYTEST: ${{ needs.classify.outputs.async_worker }}
          R_DJANGO_BRIDGE_PYTEST: ${{ needs.django-bridge-pytest.result }}
          W_DJANGO_BRIDGE_PYTEST: ${{ needs.classify.outputs.django }}
          R_PYTHON_COMPATIBILITY: ${{ needs.python-compatibility.result }}
          W_PYTHON_COMPATIBILITY: ${{ needs.classify.outputs.compat }}
          R_CQRS_PINNED_PYTEST: ${{ needs.cqrs-pinned-pytest.result }}
          W_CQRS_PINNED_PYTEST: ${{ needs.classify.outputs.cqrs }}
          R_DRIVER_FLOORS: ${{ needs.driver-floors.result }}
          W_DRIVER_FLOORS: ${{ needs.classify.outputs.floors }}
          R_SMOKE_114: ${{ needs.smoke-114.result }}
          W_SMOKE_114: ${{ needs.classify.outputs.smoke_114 }}
          R_SMOKE_112: ${{ needs.smoke-112.result }}
          W_SMOKE_112: ${{ needs.classify.outputs.smoke_112 }}
        run: |
          set -euo pipefail
          fail=0
          for var in R_CLASSIFY R_LINT_PYTHON R_QUICKSTART_TESTS R_DOCS_SYNC R_DOC_LINT R_DOCS_SITE R_PYTEST_SUITES R_DASHBOARD_PYTEST R_ASYNC_WORKER_PYTEST R_DJANGO_BRIDGE_PYTEST R_PYTHON_COMPATIBILITY R_CQRS_PINNED_PYTEST R_DRIVER_FLOORS R_SMOKE_114 R_SMOKE_112; do
            result="${!var:-}"
            wanted_var="W_${var#R_}"
            # Lanes without a W_ variable are always required.
            wanted="${!wanted_var-required}"
            if [[ "$result" == "success" ]]; then
              echo "ok      ${var#R_}"
            elif [[ "$result" == "skipped" && "$wanted" == "false" ]]; then
              echo "skipped ${var#R_} (not selected for tier '${TIER:-unknown}')"
            else
              echo "::error::Job ${var#R_} result '${result}' (selected: '${wanted}')"
              fail=1
            fi
          done
          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo 'All selected CI checks passed'
