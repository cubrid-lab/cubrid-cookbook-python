name: Mark new issues for triage

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  intake:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Intake only. Priority and size are assigned through maintainer review.
      - name: Require issue triage
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'status: needs triage'
