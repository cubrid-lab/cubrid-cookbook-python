services:
  cubrid:
    image: cubrid/cubrid:11.4
    container_name: cubrid-dashboard
    # CUBRID records the host name in databases.txt: a fixed one lets a recreated
    # container open the database it inherits (#413).
    hostname: cubrid-dashboard
    ports:
      - "33000:33000"
    environment:
      CUBRID_DB: testdb
    healthcheck:
      test: ["CMD", "csql", "-u", "dba", "testdb", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      # Named volumes keep the database across `docker compose down`; only
      # `docker compose down -v` deletes it. Images up to 11.3 keep databases in
      # /var/lib/cubrid, the 11.4 image in /home/cubrid/CUBRID/databases.
      - cubrid_data:/var/lib/cubrid
      - cubrid_databases:/home/cubrid/CUBRID/databases

  dashboard:
    # Installs the pinned requirements on start (no build step) so the
    # template stays copy-and-run; the pip_cache volume speeds up later runs.
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    environment:
      DATABASE_URL: cubrid+pycubrid://dba@cubrid:33000/testdb
    command: >
      sh -c "pip install --no-cache-dir -q -r requirements.txt &&
             streamlit run 01_table_viewer.py
               --server.address=0.0.0.0 --server.port=8501
               --browser.gatherUsageStats=false"
    ports:
      - "8501:8501"
    depends_on:
      cubrid:
        condition: service_healthy

volumes:
  cubrid_data:
  cubrid_databases:
  pip_cache:
