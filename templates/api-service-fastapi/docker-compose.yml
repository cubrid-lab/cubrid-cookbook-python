services:
  cubrid:
    image: cubrid/cubrid:11.2
    container_name: cubrid-db
    # CUBRID records the host name in databases.txt: a fixed one lets a recreated
    # container open the database it inherits (#413).
    hostname: cubrid-api-service
    environment:
      # The database .env.example's DATABASE_URL names (#412).
      CUBRID_DB: testdb
    ports:
      - "33000:33000"
    healthcheck:
      # Healthy only once testdb answers a query, not just when a server runs.
      test: ["CMD", "csql", "-u", "dba", "testdb", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: fastapi-service
    env_file:
      - .env
    depends_on:
      cubrid:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
