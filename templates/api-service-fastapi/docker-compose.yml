services:
  cubrid:
    image: cubrid/cubrid:11.2
    environment:
      # The database .env.example's DATABASE_URL names (#412).
      CUBRID_DB: testdb
      # The image registers the database for this host in databases.txt on the
      # volume; without it the host is the container's random host name, which a
      # recreated container no longer resolves (-353).
      CUBRID_DB_HOST: localhost
    ports:
      - "33000:33000"
    healthcheck:
      # Healthy only once testdb answers a query, not just when a server runs.
      test: ["CMD", "csql", "-u", "dba", "testdb", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    env_file:
      - .env
    depends_on:
      cubrid:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
